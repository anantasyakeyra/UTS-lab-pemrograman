<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Data Mahasiswa - UTS Lab Pemrograman</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="app-header">
    <h1>Sistem Data Mahasiswa</h1>
    <p>Kelola data mahasiswa: tambah, lihat, ubah, dan hapus.</p>
  </header>

  <main class="container">
    <section class="card">
      <h2 id="formTitle">Tambah Mahasiswa</h2>
      <form id="studentForm">
        <div class="grid">
          <label>
            NIM
            <input type="number" name="nim" id="nim" required />
          </label>
          <label>
            Nama
            <input type="text" name="nama" id="nama" required />
          </label>
          <label>
            Program Studi
            <input type="text" name="program_studi" id="program_studi" required />
          </label>
          <label>
            Angkatan
            <input type="number" name="angkatan" id="angkatan" required />
          </label>
          <label>
            IPK
            <input type="number" step="0.01" min="0" max="4" name="ipk" id="ipk" required />
          </label>
        </div>
        <div id="formError" class="message error" hidden></div>
        <div class="actions">
          <button type="submit" id="submitBtn">Simpan</button>
          <button type="button" id="cancelBtn" class="secondary" hidden>Batal</button>
        </div>
      </form>
    </section>

    <section class="card">
      <h2>Daftar Mahasiswa</h2>
      <div id="listError" class="message error" hidden></div>
      <div id="emptyState" class="empty" hidden>Belum ada data mahasiswa.</div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>NIM</th>
              <th>Nama</th>
              <th>Program Studi</th>
              <th>Angkatan</th>
              <th>IPK</th>
              <th>Lama Studi (tahun)</th>
              <th>Aksi</th>
            </tr>
          </thead>
          <tbody id="studentTableBody"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="detailDialog">
    <h3>Detail Mahasiswa</h3>
    <div id="detailContent"></div>
    <button type="button" id="closeDetail">Tutup</button>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
